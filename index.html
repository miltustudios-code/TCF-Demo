ues sans voitures le dimanche. Si les commerçants redoutaient d’abord une baisse de fréquentation, les premiers chiffres indiquent une légère hausse des visites. Les chercheurs rappellent cependant que la météo particulièrement favorable a pu influencer ces résultats.","prompt":"Quelle réserve les chercheurs émettent-ils ?","options":["Les commerçants ont fermé leurs magasins.","Les chiffres sont nécessairement faux.","Un facteur extérieur a pu modifier les résultats.","Le dispositif a déjà été abandonné."],"key":"Un facteur extérieur a pu modifier les résultats.","why":"La météo constitue un autre facteur explicatif.","src":"ABC TCF (2014) p.54–63 — original"},{"id":"c12","unit":2,"skill":"Listening","tag":"Point de vue","doc":"","prompt":"Quelle est l’idée principale ?","options":["Les bibliothèques doivent fermer","Les outils numériques remplacent entièrement les livres","Le numérique complète les services existants","Le personnel refuse la modernisation"],"key":"Le numérique complète les services existants","why":"Le locuteur parle de complémentarité et de maintien de l’accueil physique.","src":"ABC TCF (2014) p.26–29 — original","audio":"La mise à disposition de livres numériques a élargi notre public, notamment les personnes qui se déplacent difficilement. Cela ne signifie pas que les bibliothèques physiques deviennent inutiles. Au contraire, nous souhaitons maintenir les ateliers et l’accompagnement sur place, en complément des services en ligne.","audioData":"data:audio/mpeg;base64,SUQzBAAAAAAAIlRTU0UAAAAOAAADTGF2ZjYxLjcuMTAzAAAAAAAAAAAAAAD/83DAAAAAAAAAAAAASW5mbwAAAA8AAALEAAGyLgADBggLDRASFRcaHB8iJCcpLC4xMzY4Oz1AQ0VISk1PUlRXWVxeYWRmaWtucXN2eHt+gIOFiIuNkJKVl5qcn6Kkp6msrrGztri7vcDDxcjKzc/S1NfZ3N7h5Obp6+7w8/X4+v0AAAAATGF2YzYxLjE5AAAAAAAAAAAAAAAAJAMeAAAAAAABsi4W3Jn2AAAAAAAAAAAAAAAAAP/zYMQAH7MeNAFaaAEvAriWOgDARjCRlihEQMahORKOI0NAIWFAoEtGzeIRSpzPP//9oLTUJ4E8BOBOAm4ADAAYBcCsRsTMpqoIf//6kEEEE006BcLhcQdbqLg9B6EodHoSiJfL7oGiy4gtN0C4aGY4B6Gi003//////////+1bqQLhosuFxCmno ":"Reading","tag":"Inférence","doc":"Paul, je t’attends devant le théâtre. Le spectacle commence dans cinq minutes !","prompt":"Où vont-ils ?","options":["Au stade","Au théâtre","À la gare","Au restaurant"],"key":"Au théâtre","why":"Le spectacle et le lieu de rendez-vous donnent la réponse.","src":"ABC TCF (2014) p.43 — original"},{"id":"c18","unit":1,"skill":"Reading","tag":"Détails","doc":"Le cours du lundi est exceptionnellement déplacé au mercredi. La salle et l’heure ne changent pas.","prompt":"Quel élément est modifié ?","options":["L’heure","Le lieu","Le jour","Le professeur"],"key":"Le jour","why":"Seul le jour est déplacé.","src":"ABC TCF (2014) p.49–56 — original"},{"id":"c19","unit":2,"skill":"Reading","tag":"Argumentation","doc":"L’objectif de la nouvelle médiathèque n’est pas seulement d’offrir des livres, mais aussi de créer un espace où les habitants peuvent travailler ensemble.","prompt":"Quel autre objectif est mentionné ?","options":["Réduire les horaires","Encourager la collaboration","Vendre des ouvrages","Limiter les inscriptions"],"key":"Encourager la collaboration","why":"Le texte évoque le travail collectif.","src":"ABC TCF (2014) p.54–63 — original"}],"tasks":[{"id":"cw1b","unit":0,"skill":"Writing","title":"Tâche 1 · Message pratique","prompt":"Vous invitez un ami à visiter un nouveau quartier. Donnez le lieu, l’heure, le programme et demandez une réponse.","src":"ABC TCF (2014) p.69 — original","check":["Donner les informations demandées","Adapter le registre","Organiser le message","Demander une réponse"],"model":"Salut Alex, samedi prochain, je vais découvrir le nouveau quartier près de la gare et j’aimerais que tu viennes avec moi. On pourrait se retrouver à dix heures devant la station de métro, visiter le marché et déjeuner dans un petit restaurant. Ensuite, nous pourrions nous promener au bord de la rivière si le temps le permet. Est-ce que tu es disponible ? Dis-moi avant vendredi. À bientôt !","min":60,"max":120,"time":15},{"id":"cw2","unit":1,"skill":"Writing","title":"Tâche 2 · Expérience","prompt":"Vous avez participé à une journée de bénévolat. Écrivez un article pour le blog de votre association, racontez votre expérience et expliquez ce qu’elle vous a apporté.","src":"ABC TCF (2014) p.70–71 — original","check":["Raconter des faits","Décrire une expérience personnelle","Exprimer une appréciation","Adapter le texte au blog"],"model":"Samedi dernier, j’ai participé pour la première fois à une journée de nettoyage organisée par notre association. Nous étions une vingtaine de bénévoles réunis près de la rivière. Après une courte présentation, nous avons formé des équipes et ramassé les déchets pendant deux heures. Au début, je ne connaissais personne, mais les échanges ont rapidement créé une ambiance chaleureuse. À midi, nous avons partagé un repas et discuté de nouvelles actions possibles pour le quartier. Ce qui m’a le plus marqué, c’est la quantité de déchets que nous avons pu retirer en si peu de temps. Cette expérience m’a montré que de petits gestes collectifs peuvent avoir un effet concret. Je souhaite désormais participer plus régulièrement et j’encourage les lecteurs à rejoindre la prochaine édition.","min":120,"max":150,"time":20},{"id":"cw3","unit":2,"skill":"Writing","title":"Tâche 3 · Deux documents","prompt":"Document 1 : Le télétravail réduit les déplacements et facilite l’organisation familiale.\nDocument 2 : Le télétravail peut isoler les employés et rendre la collaboration plus difficile.\nPour un site d’actualité, présentez les deux opinions en 40–60 mots, puis donnez votre avis en 80–120 mots.","src":"ABC TCF (2014) p.72–81 — original; format officiel Canada actualisé","check":["Résumer les deux documents sans copier","Séparer synthèse et opinion","Justifier son avis","Respecter les deux longueurs"],"model":"Les deux documents présentent des effets opposés du travail à distance. Le premier insiste sur les gains de temps et la souplesse qu’il offre aux salariés. Le second attire l’attention sur les risques d’isolement et sur les difficultés que peut rencontrer une équipe lorsqu’elle travaille dans des lieux différents.\n\nÀ mon avis, un modèle hybride constitue une solution équilibrée. Travailler chez soi deux jours par semaine peut réduire la fatigue liée aux transports et permettre de se concentrer sur des tâches individuelles. Cependant, les échanges en présence restent utiles pour construire des projets collectifs et accueillir de nouveaux collègues. Il est également nécessaire de tenir compte des conditions de logement de chacun. Les entreprises devraient donc proposer des règles flexibles et les évaluer régulièrement avec leurs salariés plutôt que d’imposer le même rythme à tout le monde.","min":120,"max":180,"time":25,"split":true},{"id":"cs1","unit":0,"skill":"Speaking","title":"Tâche 1 · Entretien","prompt":"Présentez votre parcours, vos activités et vos projets.","src":"ABC TCF (2014) p.97–99 — original","check":["Répondre spontanément","Donner des détails","S’exprimer clairement"],"model":"Je travaille dans une entreprise de services. Je voudrais améliorer mon français pour poursuivre mes études au Canada.","time":2,"turns":["Pouvez-vous vous présenter ?","Pourquoi apprenez-vous le français ?","Quels sont vos projets pour l’année prochaine ?"]},{"id":"cs2","unit":1,"skill":"Speaking","title":"Tâche 2 · Interaction","prompt":"Vous souhaitez rejoindre une association sportive. Vous demandez des informations sur les cours et les conditions.","src":"ABC TCF (2014) p.97–99 — original","check":["Préparer des questions","Demander des précisions","Adapter le registre","Réagir aux réponses"],"model":"Bonjour, je voudrais connaître les activités proposées. Quels sont les horaires pour les débutants ? Puis-je assister à une séance d’essai ?","time":3.5,"prep":2,"turns":["Bonjour, association sportive. Que souhaitez-vous savoir ?","Nous avons des cours le mardi et le samedi.","La première séance est gratuite. Voulez-vous connaître les tarifs ?"]},{"id":"cs3","unit":2,"skill":"Speaking","title":"Tâche 3 · Opinion spontanée","prompt":"Est-il préférable de vivre dans une grande ville ou dans une petite ville ? Expliquez votre point de vue.","src":"ABC TCF (2014) p.99–100 — original","check":["Donner une position claire","Développer des arguments","Donner des exemples","Nuancer et conclure"],"model":"Je préfère les petites villes pour leur calme, mais les grandes villes offrent davantage de possibilités professionnelles. Tout dépend des besoins et de la situation de chacun.","time":4.5,"turns":["Est-il préférable de vivre dans une grande ville ou dans une petite ville ? Expliquez votre point de vue."]}],"mock":[{"id":"cm1","unit":0,"skill":"Reading","tag":"Horaires","doc":"Pharmacie ouverte du lundi au samedi, 9 h–19 h. Fermée dimanche.","prompt":"Quand peut-on y aller ?","options":["Dimanche matin","Mardi à 10 h","Samedi à 21 h","Lundi à 7 h"],"key":"Mardi à 10 h","why":"Mardi 10 h est dans les horaires.","src":"ABC TCF (2014) p.42 — original inédit"},{"id":"cm2","unit":1,"skill":"Reading","tag":"Démarches","doc":"Pour confirmer votre participation, envoyez le formulaire signé avant vendredi. Sans confirmation, votre place sera attribuée à une autre personne.","prompt":"Que faut-il faire ?","options":["Téléphoner vendredi","Envoyer le formulaire signé","Payer une amende","Venir sans inscription"],"key":"Envoyer le formulaire signé","why":"Le texte impose une confirmation par formulaire.","src":"ABC TCF (2014) p.49 — original inédit"},{"id":"cm3","unit":2,"skill":"Reading","tag":"Nuance","doc":"Bien que la rénovation ait réduit la consommation d’énergie, les habitants estiment que les charges restent trop élevées. Le syndic prévoit une analyse des contrats avant de décider des prochaines mesures.","prompt":"Que prévoit le syndic ?","options":["Annuler la rénovation","Étudier les contrats","Augmenter les charges immédiatement","Changer tous les habitants"],"key":"Étudier les contrats","why":"Une analyse est prévue avant toute décision.","src":"ABC TCF (2014) p.54–63 — original inédit"},{"id":"cm4","unit":0,"skill":"Listening","tag":"Situation","doc":"","prompt":"Que cherche la femme ?","options":["Un musée","Une pharmacie","Une gare","Un hôtel"],"key":"Une gare","why":"Elle demande où est la gare.","src":"ABC TCF (2014) p.20 — original inédit","audio":"Excusez-moi, la gare est loin d’ici ? Non, continuez tout droit et tournez à gauche au feu.","audioData":"data:audio/mpeg;base64,SUQzBAAAAAAAIlRTU0UAAAAOAAADTGF2ZjYxLjcuMTAzAAAAAAAAAAAAAAD/83DAAAAAAAAAAAAASW5mbwAAAA8AAADqAACP+gAEBgkMDhETFRkbHSAjJSgqLDAyNDc5PD9BQ0ZJS05QUlZYWl1fYmVnaW1vcXR2eXx+gYOGiYuNkJOVmJqcoKKkp6msr7Gzt7m7vsDDxsjKzdDS1dfZ3d/h5Obp7O7w9Pb4+/0AAAAATGF2YzYxLjE5AAAAAAAAAAAAAAAAJARRAAAAAAAAj/p8+suCAAAAAAAAAAAAAAAAAP/zYMQAHmmuTAFYeACkxp7cw1hYRpjIy0DHEMyzbQgQY4UOAkpTto8OCCRlnbjzT+TkCJ83vf++/4bGnzTJ2JoJoQhCGslYt5C1XLHu/T5znWzDcAOw5z2COBIDgP8ub4t5c2feKf4vh4yRIavnTg9ZC1HPTMN/h/PAePNQ348///////Lw+sUAAAJhdWACgQNbfoFIAi2LoUY+y//zYsQVJMt6um+PaACZPyaJc1gYgbBYQEgJAAKAUgPpamDaHo4EmX2GSfJBkzcFmbmtbi2pkmEnUwloBXEoN0XMAv5xN0gWsvoMsdgxzZ+MOMogG/FmIOSbNpEoXDNz5pqJAhmBobmjWQWUTYomv////6H1f/+pSJv/+pzhp//MzNzcwt//8+aIf8xVirAICIl5iEGwFAA/n/Nk3dH/82LEESR7xtJ3j2gBvDsDDLCL52fyEE5JErBNkiI8VIHMpOAmimkEhHRjlZGYqDmx/dIcIHnSHsF2rMhJg3iWTYkQvS1JGIcsoIpE8mEQy8fh7l3x/HgWpdIYYgl0mmR95dJQcpdKiVPPc1JVRmfPf////////RMDhl/+dPomv/6lOx5FH//9FFv//y7SW0mDLkyGyx8FNmCaUGQU//NixA8iibqkAZnAAILIaGBcCAzcYFAgoMDTA1rn2y8GXtPrY//9///8I+zwzm7UWEUKxqNGU7Ior3zrSwBApOTkMK0Q5hlAShIOWsSjxzrkAFWNzkH58fZZTpX+/p4JSma0NiDYoZv9m1/va48Lg2F9/T+wuB4Bhiksv////lQJ+p37Cwr/ylUkUBGTAAfCsEBbKVMHBULWRgAgY//zYMQUJIKekaeZmACLpCoG8TbgNFYzWCZf6oHNI1S8AKAW5AgJac0rJ1B/KQckGBdSvAwBBsEilxOYYiJoNmDGorQG1quCZQbkidUnSM2Isf1K/kyGIRcQ5wtQ/l3GWJcmiLGZef/5Ok6bE+bFQ0RSdSKOtFGknb//0XdJm+cIcTIzIzP6w6d/qBoCAACSqe/0SlQzMR/wgY1epf/zYsQRI9wVzEmYkAA/+ukHLRUviCYpwcotlcHwFmwbwdXhsAYjE/kKtVI78kCLiSDiD1EWf/4dIRcuEGHND1xNdf//FsFlpFxioTZuT////+cNCdJIcBIEXUfLJEyuYf////5oVDhEEEGLZonscLpP///////kuak+bm h} attempted</div></div><span class="pill">${!done.length?'Untested':right===done.length?'Correct so far':'Needs review'}</span></div>`}).join('')}</div>`)}function saveGoal(){state.settings={name:$('#nameInput').value.trim()||'Learner',target:$('#targetInput').value.trim()||cfg.name,date:$('#dateInput').value};save();toast('Goal saved.');progress()}function teacher(){let pending=state.submissions.filter(x=>x.status==='Pending').length;html(heading('Teacher workspace','Your teaching overview','Single-learner demonstration. All progress, submissions and assignments are real local data from this browser; no multi-user backend.')+`<div class="grid"><div class="card"><div class="small">Learner</div><div class="metric" style="font-size:25px">${esc(state.settings.name)}</div></div><div class="card"><div class="small">Pending submissions</div><div class="metric">${pending}</div></div><div class="card"><div class="small">Assignments</div><div class="metric">${state.assignments.filter(a=>a.done).length}/${state.assignments.length}</div></div></div><div class="section card"><div class="sectionhead"><h2>Skill performance</h2><button class="btn secondary" onclick="exportData()">Export learner report</button></div>${['Reading','Listening','Grammar'].map(s=>{let a=stat(s);return `<div class="splitline"><div class="between"><b>${s}</b><span class="small">${a.done?acc(a)+'% correct':'Not attempted'} · ${a.done}/${a.total}</span></div>${bar(a.done?acc(a):0)}</div>`}).join('')}</div><div class="section card"><h2>Submission review queue</h2>${state.submissions.length?`<div class="scrolltable"><table class="teacher-table"><thead><tr><th>Task</th><th>Words / checks</th><th>Status</th><th></th></tr></thead><tbody>${state.submissions.slice().reverse().map(x=>`<tr><td>${esc(x.title)}<br><span class="small">${esc(x.date.slice(0,10))}</span></td><td>${x.words} words · ${x.check}/${x.total}</td><td>${esc(x.status)}</td><td><button class="btn quiet" onclick="reviewSubmission('${x.id}')">Review</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Submit a writing task in Student view to see it here.</div>'}</div><div class="section card"><div class="sectionhead"><h2>Assignment workflow</h2><button class="btn" onclick="go('assign')">Create assignment</button></div>${state.assignments.length?state.assignments.map(a=>`<div class="between splitline"><b>${esc(a.title)}</b><span class="pill">${a.done?'Completed':'Assigned'}</span></div>`).join(''):'<div class="empty">No assignments created.</div>'}</div>`)}function reviewSubmission(id){let x=state.submissions.find(s=>s.id===id);let t=tasks.find(t=>t.id===x.task);html(`<button class="btn secondary" onclick="go('teacher')">← Review queue</button><div class="section">${heading('Teacher review',esc(x.title),'Evaluate the learner response using your own professional judgment.')}</div><div class="workspace"><div class="card"><h3>Task</h3><div class="doc">${esc(t?.prompt||'')}</div><h3>Submitted response / notes</h3><div class="doc">${esc(x.text||'No text. Recording was local; request the downloaded file.')}</div><p class="small">${x.words} words · ${x.check}/${x.total} self-checks</p></div><div class="card"><h3>Teacher feedback</h3><p class="small">Local review only. Your feedback is not an official exam grade.</p><textarea id="teacherNote" style="min-height:180px" placeholder="Feedback and next steps…">${esc(x.note||'')}</textarea><div class="row section"><button class="btn" onclick="saveReview('${x.id}')">Mark reviewed</button></div></div></div>`)}function saveReview(id){let x=state.submissions.find(s=>s.id===id);x.note=$('#teacherNote').value;x.status='Reviewed';save();toast('Feedback saved.');go('teacher')}function assign(){html(heading('Teaching tools','Assign independent practice','Create a writing or speaking task that appears in the student workspace.')+`<div class="card"><label>Choose activity<br><select id="assignTask" style="width:100%">${tasks.map(t=>`<option value="${t.id}">${esc(t.title)} · ${t.skill}</option>`).join('')}</select></label><div class="row section"><label>Due date <input id="due" type="date"></label><button class="btn" onclick="createAssignment()">Assign activity</button></div></div><div class="section card"><h2>Assigned activities</h2>${state.assignments.length?state.assignments.map(a=>`<div class="between splitline"><div><b>${esc(a.title)}</b><div class="small">${esc(a.date||'No due date')} · ${a.done?'Completed':'Pending'}</div></div><button class="btn secondary" onclick="removeAssignment('${a.id}')">Remove</button></div>`).join(''):'<div class="empty">No assigned activities.</div>'}</div>`)}function createAssignment(){let t=tasks.find(x=>x.id===$('#assignTask').value);state.assignments.push({id:'a'+Date.now(),task:t.id,title:t.title,date:$('#due').value,done:false});save();toast('Assigned to this demo learner.');assign()}function removeAssignment(id){state.assignments=state.assignments.filter(a=>a.id!==id);save();assign()}function openAssignment(id){let a=state.assignments.find(x=>x.id===id);if(a)openTask(a.task)}function exportData(){let b=new Blob([JSON.stringify({exam:cfg.name,learner:state.settings,answers:state.answers,submissions:state.submissions,assignments:state.assignments,mock:state.mock},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=cfg.slug+'-learner-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function sources(){html(heading('Academic design','Academic references','The textbook is the content and pedagogy reference; current official specifications determine the simulator.')+`<div class="card"><h2>Primary references</h2>${cfg.books.map(s=>`<p>${esc(s)}</p>`).join('')}${isPrivate?'<div class="notice">Private review version includes selected exercises from the supplied textbooks, identified by printed page number (the PDF page index may differ). Rights are not cleared for redistribution. Do not publish this version.</div>':'<div class="notice">Shareable build contains original exercises mapped to textbook objectives. No direct textbook exercise excerpts are included. Not an official or endorsed platform.</div>'}<p class="small">The supplied TCF edition is from 2014, so its old exam overview is not used to define TCF Canada. Grammar is learning-only for TEF/TCF Canada.</p><h3>Current specifications and supplementary practice</h3><div class="linklist"><a href="${cfg.url}" target="_blank" rel="noopener">Official ${cfg.name} examination information ↗</a><a href="https://www.lefrancaisdesaffaires.fr/en/candidate/test-evaluation-francais/tef-canada/preparation/" target="_blank" rel="noopener">CCI Paris preparation resources ↗</a><a href="https://apprendre.tv5monde.com/en/tcf" target="_blank" rel="noopener">TV5MONDE TCF practice ↗</a><a href="https://www.canada.ca/en/immigration-refugees-citizenship/services/immigrate-canada/express-entry/documents/language-test.html" target="_blank" rel="noopener">IRCC official language test benchmarks ↗</a><a href="https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors-search" target="_blank" rel="noopener">CEFR descriptors ↗</a></div></div><div class="section card"><h2>Design research</h2><p><a href="https://www.prepmyfuture.com/en" target="_blank" rel="noopener">PrepMyFuture</a> — exam-oriented sequence, statistics and mock mode.</p><p><a href="https://french.kwiziq.com/tour" target="_blank" rel="noopener">Kwiziq</a> — concept mastery and personalised review.</p><p><a href="https://support.global-exam.com/en/what-does-my-subscription-contain" target="_blank" rel="noopener">GlobalExam</a> — separate study and exam modes.</p><p><a href="https://www.tcftefprep.com/" target="_blank" rel="noopener">TCF TEF Prep</a> — productive skill training and progress tracking.</p><p class="small">Design choice: combine a lesson-first curriculum, explicit source mapping, real local assignment workflow, and cautious feedback rather than claiming calibrated scores. Competitors were reviewed via public descriptions, not paid account testing.</p></div><div class="section card"><h2>Local demo limitations</h2><p>All data is stored on this browser only. No authentication, server, real-time AI, shared classrooms, cloud recording or validated score prediction is implemented. Audio is synthesized for demonstration. A human educator should review content before commercial use.</p><button class="btn secondary" onclick="resetData()">Reset local demo data</button></div>`)}function resetData(){if(confirm('Clear all demo progress, submissions and assignments on this device?')){try{localStorage.removeItem(key)}catch(e){}location.reload()}}go('home');
